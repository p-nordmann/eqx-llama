[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "eqx-llama"
version = "0.0.1"
authors = [{ name = "Pierre-Louis Nordmann" }]
description = "LLaMA implementation with Jax and Equinox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chex>=0.1.92",
    "equinox>=0.13.8",
    "jax>=0.11.2",
    "jaxtyping>=0.3.11",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "datasets>=5.0.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "optax>=0.2.8",
    "pytest>=9.1.1",
    "tqdm>=4.70.1",
]

[tool.setuptools]
packages = ["eqx_llama"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["F722"]

[project.optional-dependencies]
cuda13 = ["jax[cuda13]>=0.11.2"]
